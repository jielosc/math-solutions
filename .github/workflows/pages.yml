name: Deploy math solutions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_html: ${{ steps.content.outputs.has_html }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - name: Check for HTML
        id: content
        run: |
          if find _site -type f \( -iname '*.html' -o -iname '*.htm' \) -print -quit | grep -q .; then
            echo 'has_html=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_html=false' >> "$GITHUB_OUTPUT"
            echo 'No HTML yet; deployment will start when HTML is added.'
          fi
      - uses: actions/configure-pages@v5
        if: steps.content.outputs.has_html == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.content.outputs.has_html == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.has_html == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
